version: '3.8'
services:
  db_postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elecciones
    ports:
      - 5432:5432
    volumes:
      - ./elecciones_territoriales/schema:/docker-entrypoint-initdb.d:ro

  db_mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - 3306:3306
    volumes:
      - ./mydb/schema:/docker-entrypoint-initdb.d:ro

  db_mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - 1433:1433
    volumes:
      - ./libreria/schema:/var/opt/mssql/scripts:ro
